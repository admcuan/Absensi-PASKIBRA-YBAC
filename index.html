<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Online - PASKIBRA YBAC</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #060606;
            --panel: rgba(17, 17, 17, 0.92);
            --panel-2: #1b1b1b;
            --text: #f5f5f5;
            --muted: #9ca3af;
            --accent: #fbbf24;
            --accent-2: #ef4444;
            --border: rgba(255,255,255,0.12);
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        .video-background {
            position: fixed;
            inset: 0;
            z-index: -20;
            overflow: hidden;
            background: #000;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            inset: 0;
            z-index: -10;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(0.8px);
        }

        .gold-glow {
            box-shadow: 0 0 0 1px var(--border), 0 18px 45px rgba(0,0,0,0.45), 0 0 30px rgba(251, 191, 36, 0.14);
            backdrop-filter: blur(10px);
        }

        .input-style {
            background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
            border: 1px solid var(--border);
            color: var(--text);
            transition: all 0.2s ease;
        }

        .input-style:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.16);
            outline: none;
        }

        .btn-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(251, 191, 36, 0.22);
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
        }

        .audio-toggle {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 60;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 0.5rem 0.75rem;
            border-radius: 999px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }

        .audio-toggle.hidden { display: none; }

        .audio-toggle svg { width: 18px; height: 18px; fill: currentColor; }

        @media (max-width: 640px) {
            .audio-toggle { right: 0.75rem; left: 0.75rem; justify-content: center; }
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="video-background">
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="Animasi Bendera Indonesia vertikal.mp4" type="video/mp4">
            Browser Anda tidak mendukung video latar.
        </video>
    </div>
    <div class="video-overlay"></div>

    <!-- Audio: start muted (improves autoplay chances), provide toggle for unmute -->
    <audio id="bgAudio" autoplay muted loop preload="auto" playsinline>
        <source src="Instrumental Lagu Nasional Indonesia.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung pemutar audio.
    </audio>

    <button id="audioToggle" class="audio-toggle hidden" aria-label="Aktifkan suara">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z"></path><path d="M16.5 12c0-1.77-.77-3.36-1.97-4.44l-1.43 1.43A5.493 5.493 0 0 1 15 12c0 1.38-.51 2.63-1.33 3.57l1.43 1.43C15.73 15.36 16.5 13.77 16.5 12z"></path></svg>
        Aktifkan Suara
    </button>

    <div class="content-wrapper max-w-md w-full bg-zinc-900/90 border border-zinc-800 rounded-3xl p-6 md:p-8 gold-glow relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 flex">
            <div class="w-1/2 bg-red-600"></div>
            <div class="w-1/2 bg-white"></div>
        </div>

        <div class="text-center mt-2 mb-6">
            <div class="relative inline-block">
                <img src="Logo.png" alt="Logo Paskibra YBAC" class="w-24 h-24 mx-auto mb-3 object-contain rounded-full border-2 border-amber-500/40 p-1 bg-white/95 shadow-[0_0_25px_rgba(251,191,36,0.2)]" onerror="this.src='https://via.placeholder.com/100?text=YBAC'">
                <div class="absolute inset-0 rounded-full border border-amber-400/20 animate-pulse"></div>
            </div>
            <h1 class="text-xl font-bold tracking-[0.25em] text-amber-400 uppercase">PASKIBRA YBAC</h1>
            <p class="text-xs text-zinc-400 font-medium tracking-[0.25em] mt-1">YAYASAN PENDIDIKAN BUDI ARTI</p>
            <div class="h-0.5 w-20 bg-gradient-to-r from-amber-500 via-yellow-300 to-amber-500 mx-auto mt-3 rounded-full"></div>
        </div>

        <form id="attendanceForm" onsubmit="sendToWhatsApp(event)" class="space-y-4">
            <div>
                <label for="nama" class="block text-xs font-semibold text-zinc-300 uppercase mb-1">Nama Lengkap</label>
                <input type="text" id="nama" required placeholder="Masukkan nama lengkap..." class="input-style w-full rounded-xl px-4 py-2.5 text-sm">
            </div>
            <div>
                <label for="kelas" class="block text-xs font-semibold text-zinc-300 uppercase mb-1">Kelas / Angkatan</label>
                <input type="text" id="kelas" required placeholder="Contoh: X IPA 1 / Angkatan 15" class="input-style w-full rounded-xl px-4 py-2.5 text-sm">
            </div>
            <div>
                <label for="status" class="block text-xs font-semibold text-zinc-300 uppercase mb-1">Status Kehadiran</label>
                <select id="status" required class="input-style w-full rounded-xl px-4 py-2.5 text-sm">
                    <option value="" disabled selected>-- Pilih Status --</option>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>
            <div>
                <label for="keterangan" class="block text-xs font-semibold text-zinc-300 uppercase mb-1">Keterangan (Opsional)</label>
                <textarea id="keterangan" rows="2" placeholder="Catatan/alasan jika izin atau sakit..." class="input-style w-full rounded-xl px-4 py-2.5 text-sm"></textarea>
            </div>
            <button type="submit" class="btn-hover w-full mt-2 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-zinc-950 font-bold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                </svg>
                Kirim Absensi Ke WhatsApp
            </button>
        </form>

        <p class="text-center text-[10px] text-zinc-500 mt-6">
            &copy; PASKIBRA YBAC - Sistem Absensi Otomatis
        </p>
    </div>

    <script>
        // Coba autoplay saat load. Jika browser memblokir, tampilkan tombol untuk mengaktifkan suara.
        window.addEventListener('load', async () => {
            const bgAudio = document.getElementById('bgAudio');
            const audioToggle = document.getElementById('audioToggle');

            if (!bgAudio) return;

            // Pastikan audio di-mute untuk memaksimalkan peluang autoplay bekerja
            bgAudio.muted = true;

            try {
                await bgAudio.play();
                // Jika autoplay berhasil tapi masih muted, tunjukkan tombol untuk meng-unmute
                if (bgAudio.muted) {
                    audioToggle.classList.remove('hidden');
                }
            } catch (err) {
                // Jika play() ditolak, tampilkan tombol untuk men-trigger pemutaran
                audioToggle.classList.remove('hidden');
            }

            // Klik tombol -> meng-unmute dan play
            audioToggle.addEventListener('click', async () => {
                try {
                    bgAudio.muted = false;
                    await bgAudio.play();
                    audioToggle.classList.add('hidden');
                } catch (err) {
                    // jika masih gagal, pastikan tombol tetap terlihat agar pengguna mencoba lagi
                    audioToggle.classList.remove('hidden');
                }
            });

            // sembunyikan tombol bila pengguna berinteraksi di halaman (tap/click) — sebagai fallback
            const onUserInteract = async () => {
                if (bgAudio.muted) {
                    try {
                        bgAudio.muted = false;
                        await bgAudio.play();
                        audioToggle.classList.add('hidden');
                    } catch (e) {
                        audioToggle.classList.remove('hidden');
                    }
                } else {
                    audioToggle.classList.add('hidden');
                }
                document.removeEventListener('click', onUserInteract);
                document.removeEventListener('touchstart', onUserInteract);
            };
            document.addEventListener('click', onUserInteract, { once: true });
            document.addEventListener('touchstart', onUserInteract, { once: true });
        });

        function sendToWhatsApp(event) {
            event.preventDefault();
            const nama = document.getElementById('nama').value.trim();
            const kelas = document.getElementById('kelas').value.trim();
            const status = document.getElementById('status').value;
            const keterangan = document.getElementById('keterangan').value.trim() || '-';
            const sekarang = new Date();
            const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const tanggalStr = sekarang.toLocaleDateString('id-ID', opsiTanggal);
            const jamStr = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
            const targetPhone = '6283874795123';
            const statusEmoji = status === 'Hadir' ? '✅' : status === 'Izin' ? '📝' : '🩺';
            const statusLabel = status === 'Hadir' ? 'HADIR' : status === 'Izin' ? 'IZIN' : 'SAKIT';
            const message = `*ABSENSI PASKIBRA YBAC*\\n=======================================\\n📅 *Hari/Tanggal:* ${tanggalStr}\\n⏰ *Waktu:* ${jamStr}\\n\\n👤 *Nama Lengkap:* ${nama}\\n🏫 *Kelas/Angkatan:* ${kelas}\\n${statusEmoji} *Status Kehadiran:* ${statusLabel}\\n📝 *Keterangan:* ${keterangan}\\n\\n📌 *Ringkasan:*\\n- Nama: ${nama}\\n- Kelas/Angkatan: ${kelas}\\n- Status: ${status}\\n- Catatan: ${keterangan}\\n- Waktu presensi: ${jamStr}\\n\\n=======================================\\n_Dikirim otomatis melalui sistem presensi online Paskibra YBAC._`;
            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${targetPhone}?text=${encodedMessage}`;
            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
